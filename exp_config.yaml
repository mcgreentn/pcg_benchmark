# --- search budget -------------------------------------------------------------
# Evaluations per iteration = n_emitters * batch_size. Total = that x n_iterations.
#
# Sized for the 48-core remote from `benchmark.py all` (40.2 evals/s at 48 workers,
# ~1.2s per eval, 280 MB per worker against a 125 GB budget -- CPU-bound, nowhere
# near memory-bound). Two rules shaped these numbers:
#
#   1. n_emitters * batch_size is the whole wave Dask gets per iteration. Below
#      `workers` some workers idle every iteration; not a multiple of it and every
#      iteration ends on a ragged partial wave. 4 x 24 = 96 = exactly two full waves.
#   2. batch_size is the CMA-ES population. The rule of thumb is 4 + 3*ln(dim), and
#      dim = 2869 here, so ~27 -- which is what pyribs picks if you leave batch_size
#      unset. The old value of 3 was a population of three on a 2869-dim search.
n_emitters: 4          # independent CMA-ES distributions
batch_size: 24         # genomes each emitter proposes per iteration (CMA-ES lambda)
# ~2.4s per iteration at 96 evals/iter, so ~1500 iterations/hour. 2000 is roughly a
# 1.3-hour run and 192,000 evaluations. Raise for a longer search.
n_iterations: 2000     # ask/tell cycles
# Each archive CSV is one row per elite x ~2875 columns, ~9 MB at the current 4^4
# grid. At interval 5 a 2000-iteration run would write 400 files / ~3.6 GB.
checkpoint_interval: 200  # dump the archive every N iterations
workers: 48            # Dask processes, one thread each -- the measured throughput peak
# Torch intra-op threads INSIDE each evaluation. Keep at 1: parallelism here is
# across genomes, and the net is far too small to gain from a thread pool. Left
# unset torch sizes it from os.cpu_count(), which in a container reports the HOST's
# cores -- workers x that many threads against a small quota, and throughput drops
# (measured 2.5x slower at 4 workers). Run `benchmark.py all` on the target box to
# size this and `workers` together.
torch_threads: 1

# --- search behaviour ----------------------------------------------------------
sigma0: 1.0            # initial mutation spread of each emitter
ranker: "2imp"         # how pyribs ranks candidates (see ribs.emitters.rankers)

# --- evaluation ----------------------------------------------------------------
game_time: 20          # seconds of simulated game per evaluation

# Seeds the initial network, every emitter, and the archive. Set to null for a
# different search each run; with a seed, identical configs reproduce exactly.
seed: 0

# Behavior measures -- the archive axes, in order. These describe HOW a run played;
# the objective (completion %) is the only thing being maximized.
# Ranges must cover real play: pyribs clips out-of-range values into the edge cell
# rather than erroring, which silently merges distinct behaviors.
#
# `max: auto` resolves at startup: coins/kills from level_path (lvl-1 holds 11 coins
# and 15 enemies), time from game_time above. Jumps has no natural ceiling to read.
measures:
  coins: {bins: 4, max: auto}         # tile coins collected
  kills: {bins: 4, max: auto}         # enemies defeated, falls excluded
  time:  {bins: 4, max: auto}         # seconds left on the clock -- speedrunning
  jumps: {bins: 4, min: 0, max: 24}   # jumps taken -- acrobatics (heuristic scores 22)
level_path: "./data/smb/original/lvl-1.txt"

# Everything a run produces (archive CSVs, heatmaps, scratch dirs) goes here.
# Untracked -- see .gitignore. Override per-run with the PCG_OUTPUT_DIR env var.
output_dir: "./output/smb"